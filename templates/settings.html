<!-- templates/settings.html -->
{% extends "base.html" %}

{% block content %}
    <h2>Settings</h2>
    <p>Manage your Expiry Lens preferences.</p>

    <div class="glass-card settings-card">
        <h3>Appearance</h3>
        <div class="settings-row">
            <span>Dark Mode</span>
            <label class="toggle-switch">
                <input type="checkbox" id="dark-mode-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <div class="glass-card settings-card">
        <h3>Account</h3>
        <p><strong>Logged in as:</strong> {{ username }}</p>
        <a href="/logout" class="upload-button settings-logout-btn">Log Out</a>
    </div>
{% endblock %}
