<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiry Lens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

    <!-- PWA setup -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}">
</head>
<body>

    <header>
        <div class="header-top">
            <div>
                <h1>🌿 Expiry Lens</h1>
                <p>AI-Powered Food Waste Management</p>
            </div>
            {% if username %}
                <div class="header-user">
                    <a href="/" class="nav-link">Dashboard</a>
                    <a href="/settings" class="nav-link">Settings</a>
                    <span>Hi, {{ username }}</span>
                    <a href="/logout" class="logout-link">Logout</a>
                </div>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Expiry Lens - InnoChamp Innovation Competition</p>
    </footer>

    <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search_filter.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dark_mode.js') }}"></script>

    <script>
        // Register our service worker so the browser recognizes this as an installable PWA
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("{{ url_for('static', filename='js/service_worker.js') }}");
        }
    </script>
</body>
</html>
